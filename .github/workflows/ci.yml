# switchboard — GitHub CI (MIRROR host). The comprehensive Go gate: gofmt, vet, build, golangci-lint,
# govulncheck, and the FULL test suite including the Postgres-backed store tests (run against a
# service container). Keep the checks in sync with .gitea/workflows/ci.yaml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SWITCHBOARD_TEST_DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "unformatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (incl. Postgres store tests)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      - name: govulncheck (advisory)
        # Non-blocking: govulncheck surfaces advisories (including stdlib ones fixed only in a newer
        # Go patch than the declared toolchain) — those are actioned by a Go bump, not by failing
        # every push. Findings still show in the log; revisit when bumping the go directive.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
