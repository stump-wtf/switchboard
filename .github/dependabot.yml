# Dependabot keeps the docs-site (npm) and the GitHub Actions workflows up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
