# Reference compose for switchboard (service + PostgreSQL). StumpCloud deploys via Ansible; this
# documents the runtime shape and is runnable locally. For a real login, set the OIDC env; or set
# SWITCHBOARD_DEV_LOGIN=1 to exercise the vend → Channels loop without Pocket ID.
services:
  db:
    # Upgrading an EXISTING volume from a previous major (e.g. 16 → 18) is NOT in-place: Postgres
    # refuses to start on a data directory written by another major version. Dump before the bump
    # and restore after, or start from an empty volume:
    #   docker compose exec db pg_dumpall -U switchboard > sb.sql   # on the OLD image
    #   docker compose down -v && docker compose up -d db
    #   docker compose exec -T db psql -U switchboard < sb.sql
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: switchboard
      # Pin PGDATA. The postgres:18 image moved its default from /var/lib/postgresql/data to
      # /var/lib/postgresql/18/docker, so the volume mount below would no longer cover the data
      # directory: Postgres would initialize into the container's writable layer and every byte
      # would vanish on the next `docker compose down`, silently and with a healthy-looking stack.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - switchboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard"]
      interval: 5s
      timeout: 5s
      retries: 12

  switchboard:
    # Published image by default, so the stack runs from this one file with no
    # checkout. To build from source instead, comment `image` out and uncomment
    # `build` — the Dockerfile is hermetic (dependencies vendored, no network),
    # so that costs one compile and nothing else.
    image: ghcr.io/stump-wtf/switchboard:latest
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SWITCHBOARD_ADDR: 0.0.0.0:8080
      # Loopback by default so a fresh clone works unconfigured. Set this to your externally
      # reachable URL: it builds the OIDC redirect, the vended MCP endpoint URLs and the webhook
      # ingest URLs, and an `https://` value is what marks session cookies Secure.
      SWITCHBOARD_BASE_URL: ${SWITCHBOARD_BASE_URL:-http://127.0.0.1:8080}
      SWITCHBOARD_DATABASE_URL: postgres://switchboard:change-me@db:5432/switchboard?sslmode=disable
      SWITCHBOARD_OIDC_ISSUER: ${SWITCHBOARD_OIDC_ISSUER:-}
      SWITCHBOARD_OIDC_CLIENT_ID: ${SWITCHBOARD_OIDC_CLIENT_ID:-}
      SWITCHBOARD_OIDC_CLIENT_SECRET: ${SWITCHBOARD_OIDC_CLIENT_SECRET:-}
      SWITCHBOARD_GITHUB_SECRET: ${SWITCHBOARD_GITHUB_SECRET:-}
      # Encrypts at rest the secrets switchboard must keep recoverable — currently self-managed
      # webhook HMAC signing secrets, which cannot be hashed because verification recomputes the
      # HMAC. Empty leaves the legacy plaintext behavior SILENTLY: the stack looks healthy and the
      # secrets sit in Postgres in the clear. Set it before creating self-managed webhooks:
      # `openssl rand -base64 32`. Governing: ADR-0002, SPEC-0006.
      SWITCHBOARD_SECRET_ENCRYPTION_KEY: ${SWITCHBOARD_SECRET_ENCRYPTION_KEY:-}
      # SWITCHBOARD_DEV_LOGIN: "1"   # dev only — bypasses OIDC
    ports:
      # Bind to loopback on the host. switchboard is a self-contained OIDC relying party (ADR-011),
      # so any non-loopback exposure just needs a plain Caddy reverse_proxy — no forward_auth.
      #
      # Streaming caveat (ADR-0017; SPEC-0014): the vended MCP notification stream is a long-lived
      # Streamable-HTTP response on `GET /mcp/{endpoint}`. The reverse proxy MUST NOT buffer it, or
      # channel doorbells stall until the connection closes. With Caddy, disable response buffering on
      # that path — `reverse_proxy switchboard:8080 { flush_interval -1 }` (or a matcher scoped to
      # `/mcp/*`). nginx: `proxy_buffering off;` for the same location.
      #
      # Pre-auth rate limiting behind a TLS-terminating proxy (SPEC-0014 "Rate Limiting"): the
      # per-endpoint MCP limiter keys on the client IP, but Caddy terminates TLS so EVERY agent arrives
      # from the proxy's single upstream IP — without care they share one pre-auth bucket. Either have
      # Caddy pass a trusted `X-Forwarded-For` and key the limiter on it, or size the pre-auth budget for
      # the aggregate fleet. Keep the per-endpoint (post-auth) limiter as the real volumetric guard.
      - "127.0.0.1:8080:8080"


  # Compiled Docusaurus docs, served static by Caddy on :80 and fronted at
  # https://switchboard.stump.wtf/docs/. Built + pushed by .gitea/workflows/docs.yaml. The front
  # reverse proxy (Ansible-managed, external to this repo) routes /docs to this container with the
  # prefix STRIPPED, e.g. Caddy:
  #   switchboard.stump.wtf {
  #     redir /docs /docs/ 308            # bare /docs -> /docs/ (handle_path /docs/* excludes it)
  #     handle_path /docs/* { reverse_proxy 127.0.0.1:8081 }
  #     handle { reverse_proxy 127.0.0.1:8080 { flush_interval -1 } }   # the app (see below)
  #   }
  # (GitHub Pages was retired: a private org repo on the Team plan cannot serve Pages.)
  # Commented out deliberately: this image is published by our own CI to a registry you cannot
  # reach, so leaving it enabled would fail the stack on a pull nobody can satisfy. The docs are
  # readable at https://switchboard.stump.wtf/docs/, and `docs-site/` in this repo builds them.
  # switchboard-docs:
  #   image: <your registry>/switchboard-docs:latest
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8081:80"

volumes:
  switchboard-db:
