{{define "layout"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Switchboard</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
  body { font-family: var(--pico-font-family, ui-monospace, monospace);
    background: var(--pico-background-color); color: var(--pico-color);
    margin: 0; line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  header.top { display: flex; align-items: center; gap: .6rem; padding: .8rem 1.25rem;
    border-bottom: 1px solid var(--pico-muted-border-color); background: var(--pico-card-sectioning-background-color); }
  header.top .brand { color: var(--sb-brass-bright); font-weight: 700; letter-spacing: .03em; }
  header.top .spacer { margin-left: auto; }
  header.top a { color: var(--sb-cream-muted); text-decoration: none; margin-left: 1rem; }
  header.top form.logout { display: inline; margin: 0 0 0 1rem; }
  header.top button.linklike { background: none; border: none; padding: 0; margin: 0; font: inherit;
    color: var(--sb-cream-muted); text-decoration: none; cursor: pointer; }
  h1 { color: var(--pico-h1-color); font-size: 1.5rem; }
  h2 { color: var(--sb-brass-bright); font-size: 1.05rem; border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: .3rem; margin-top: 2rem; }
  a { color: var(--sb-brass); }
  table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--pico-muted-border-color); font-size: .9rem; }
  th { color: var(--sb-cream-muted); font-weight: 600; }
  input, select, textarea { background: var(--pico-form-element-background-color);
    color: var(--pico-color); border: 1px solid var(--pico-form-element-border-color);
    border-radius: .25rem; padding: .4rem .55rem; font: inherit; }
  label { display: block; font-size: .85rem; color: var(--sb-cream-muted); margin: .6rem 0 .2rem; }
  button, .btn { background: var(--sb-brass); color: var(--sb-bakelite); border: none;
    border-radius: .25rem; padding: .45rem .9rem; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--sb-oxblood); border: 1px solid var(--sb-oxblood); }
  .card { background: var(--pico-card-background-color); border: 1px solid var(--pico-card-border-color);
    border-radius: .5rem; padding: 1rem 1.15rem; margin: 1rem 0; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .72rem;
    font-weight: 600; border: 1px solid currentColor; }
  .badge.signed { color: var(--sb-patch-green); } .badge.token { color: var(--sb-amber); }
  .badge.open { color: var(--sb-oxblood); } .badge.queue { color: var(--sb-patch-blue); }
  .badge.active { color: var(--sb-patch-green); } .badge.revoked { color: var(--sb-cream-muted); }
  code, pre { background: var(--pico-code-background-color); color: var(--sb-brass-bright); border-radius: .3rem; }
  code { padding: .1rem .35rem; } pre { padding: .8rem; overflow-x: auto; font-size: .82rem; }
  .muted { color: var(--sb-cream-muted); font-size: .85rem; }
  .warn { border-left: 3px solid var(--sb-amber); padding-left: .8rem; color: var(--sb-amber); }
</style>
</head>
<body>
<header class="top">
  <span class="brand">◍ Switchboard</span>
  <span class="spacer"></span>
  {{if .Human}}<span class="muted">{{.Human.DisplayName}}</span><form class="logout" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button type="submit" class="linklike">log out</button></form>{{else}}<a href="/login">log in</a>{{end}}
</header>
<main class="wrap">{{template "content" .}}</main>
</body>
</html>{{end}}
