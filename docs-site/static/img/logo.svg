<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Switchboard">
  <title>Switchboard</title>
  <!-- patch cords: charm-purple lines from the top-left jack to the other two -->
  <g fill="none" stroke="#7D56F4" stroke-width="3.4" stroke-linecap="round">
    <path d="M16 19 46 30"/>
    <path d="M16 19 33 47"/>
  </g>
  <!-- three panel jacks: charm pink, neon cyan, neon mint -->
  <circle cx="16" cy="19" r="7" fill="#FF5FA2"/>
  <circle cx="46" cy="30" r="7" fill="#4EE6FF"/>
  <circle cx="33" cy="47" r="7" fill="#00F0A8"/>
  <!-- dark plug bores -->
  <g fill="#08080F">
    <circle cx="16" cy="19" r="2.8"/>
    <circle cx="46" cy="30" r="2.8"/>
    <circle cx="33" cy="47" r="2.8"/>
  </g>
</svg>
