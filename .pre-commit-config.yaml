# Local pre-commit gate: hygiene checks before every commit. Install with `pre-commit install`.
# (Go formatting/linting hooks — gofmt, golangci-lint — get added once the Go code lands.)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
