# Gitea Actions: build the Docusaurus docs site, and on main publish it as a static-server image to
# gitea.stump.rocks/stump.wtf/switchboard-docs. The compiled site is served by the front Caddy at
# https://switchboard.stump.wtf/docs/ (Caddy handle_path /docs/* → the switchboard-docs container).
#
# Two jobs, so verification and publication fail independently (issue 245, SPEC-0027 REQ-12
# "Release-Honest Docs"):
#   build   — every pull request and push that touches the docs. npm ci + npm run build, no secret,
#             no image. onBrokenLinks is 'throw', so a broken link or an MDX error fails the PR.
#   publish — push to main (and workflow_dispatch) only, after build passes. Rebuilds with baseUrl
#             /docs/ and bakes the output into a Caddy image that only COPYs the static files — no
#             Node in the image, so the docker build needs no BuildKit egress. It FAILS when
#             REGISTRY_TOKEN is unset: an unset secret is red, never a green run that pushed nothing.
# StumpCloud's Ansible pulls :latest with `pull: always`, so a redeploy picks up the newest docs.
#
# The pull_request trigger is path-filtered, so a PR that touches no docs posts no docs status at
# all. That is fine while the check is advisory; do not make it a required check without dropping
# the path filter, or every non-docs PR waits forever for a status that never arrives. The two path
# lists are kept identical by hand (no YAML anchors: not every Gitea trigger parser resolves them).
#
# The docs are served from the app's own domain via Caddy rather than GitHub Pages, which was
# retired for this repo while it was still private.
name: docs-build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'static/tokens.css'
      - 'deploy/docker/docs.Dockerfile'
      - 'deploy/docker/docs.Caddyfile'
      - '.gitea/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'static/tokens.css'
      - 'deploy/docker/docs.Dockerfile'
      - 'deploy/docker/docs.Caddyfile'
      - '.gitea/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the docs site (fails on a broken link or an MDX error)
        working-directory: docs-site
        run: npm ci --no-audit --no-fund && npm run build
        env:
          DOCS_URL: https://switchboard.stump.wtf

  publish:
    name: build + push docs
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      REG: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Require REGISTRY_TOKEN
        run: |
          if [ -z "$REG" ]; then
            echo "REGISTRY_TOKEN is not set: the docs image cannot be pushed, so this run fails instead of reporting a publish that never happened." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the docs site (baseUrl /docs/, url switchboard.stump.wtf)
        working-directory: docs-site
        run: npm ci --no-audit --no-fund && npm run build
        env:
          DOCS_URL: https://switchboard.stump.wtf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.stump.rocks/stump.wtf/switchboard-docs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push the docs image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/docs.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/switchboard-docs:buildcache
          cache-to: type=registry,ref=gitea.stump.rocks/stump.wtf/switchboard-docs:buildcache,mode=max
