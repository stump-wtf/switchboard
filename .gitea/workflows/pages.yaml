# Build the Docusaurus docs site (docs-site/) and publish it to Gitea Pages via Garage S3.
# Live at: https://joestump.pages.stump.rocks/switchboard/  (garage-pages-deploy derives the
# /switchboard/ path from the repo name — no path input needed).
#
# Requires repo secrets PAGES_ACCESS_KEY_ID / PAGES_SECRET_ACCESS_KEY (the shared joestump Garage
# S3 credentials), provisioned by the stumpcloud/ansible pages playbook after adding `switchboard`
# to joestump's repo list in dub.yaml — or set manually from OpenBao secret/pages/joestump.
name: Deploy Docs to Gitea Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/adr/**'
      - 'docs/specs/**'
      - 'static/tokens.css'
      - '.gitea/workflows/pages.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build
        working-directory: docs-site
        run: npm run build
      - name: Deploy to Gitea Pages
        # Skips (instead of failing red) until the Garage S3 secrets are provisioned — the build
        # above still validates the site on every push. Once PAGES_ACCESS_KEY_ID is set, this runs.
        env:
          PAGES_KEY: ${{ secrets.PAGES_ACCESS_KEY_ID }}
        if: ${{ env.PAGES_KEY != '' }}
        uses: https://gitea.stump.rocks/stumpcloud/garage-pages-deploy@v1
        with:
          source_dir: docs-site/build
          access_key_id: ${{ secrets.PAGES_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.PAGES_SECRET_ACCESS_KEY }}
