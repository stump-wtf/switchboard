# Secret scan via the shared stumpcloud/gitleaks-action. Comment-only
# (publish: false) — no Garage HTML report, so no PAGES_* creds needed.
name: Secret scan (gitleaks)

on:
  push:
    # train/** is the merge train (ADR-0032): a train commit is main plus one
    # PR, and it must pass the same secret scan a PR does. The scan stays
    # comment-only (publish: false), so a train run publishes nothing.
    branches: [main, 'train/**']
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: https://gitea.stump.rocks/stumpcloud/gitleaks-action@v1
        with:
          gitea-token: ${{ github.token }}
          publish: "false"
