# Gitea Actions: build + scan + push the switchboard container image to
# gitea.stump.rocks/joestump/switchboard. On every push to main (once REGISTRY_TOKEN is set):
#   - docker build (amd64) from deploy/docker/Dockerfile
#   - Trivy scan (fail-closed on HIGH/CRITICAL with a fix)
#   - push :latest, :main, :sha-<short>
# StumpCloud's Ansible references :latest with `pull: always`, so an ie01 redeploy picks up HEAD.
#
# Registry auth: on Gitea < 1.26 the automatic per-run token (gitea.token) is REJECTED by the
# container registry even with `permissions: packages: write` — VERIFIED: it returns
# `Get "https://gitea.stump.rocks/v2/": unauthorized` (401) at docker login. Package-scoped Actions
# tokens landed in Gitea 1.26; until this instance is on >= 1.26, a real PAT with write:package scope
# is required. Set a purpose-scoped `REGISTRY_TOKEN` repo secret (username joestump). Until it's set,
# every step below skips and the workflow stays green; the first push after the secret lands builds
# + publishes. Modeled on reduit.
#
# ONCE THIS GITEA IS >= 1.26: drop REGISTRY_TOKEN entirely and log in with the free automatic token —
#   username: ${{ gitea.actor }}
#   password: ${{ gitea.token }}
# (the `permissions: packages: write` block below then grants it push to joestump's own packages).
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + scan + push
    runs-on: ubuntu-latest
    env:
      # Step-level `if: env.REG != ''` gates the whole job on the secret (secrets can't be used in
      # `if` directly). No token → all steps skip → job is green.
      REG: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.REG != '' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ env.REG != '' }}
        name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.stump.rocks/joestump/switchboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - if: ${{ env.REG != '' }}
        name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump
          password: ${{ secrets.REGISTRY_TOKEN }}

      - if: ${{ env.REG != '' }}
        name: Build amd64 image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: gitea.stump.rocks/joestump/switchboard:scan-${{ gitea.run_id }}
          build-args: |
            VERSION=${{ gitea.sha }}
          cache-from: type=registry,ref=gitea.stump.rocks/joestump/switchboard:buildcache

      - if: ${{ env.REG != '' }}
        name: Trivy image scan
        uses: docker://aquasec/trivy:latest
        with:
          args: image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table gitea.stump.rocks/joestump/switchboard:scan-${{ gitea.run_id }}

      - if: ${{ env.REG != '' }}
        name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ gitea.sha }}
          cache-from: type=registry,ref=gitea.stump.rocks/joestump/switchboard:buildcache
          cache-to: type=registry,ref=gitea.stump.rocks/joestump/switchboard:buildcache,mode=max
