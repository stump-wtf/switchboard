# switchboard — Gitea CI (PRIMARY host). Go correctness gate: gofmt, vet, build, test.
# setup-go works on this act_runner (reduit proves it) — unlike setup-python (see the design record).
# The FULL suite — including the Postgres-backed store/server tests — runs against a service
# container, so the gate executes what branch protection actually claims to gate (issue #128).
# Reproduce locally with `make ci`.
# NOTE: act_runner runs jobs in docker containers and reaches services by network alias, not by
# published localhost ports — hence the DSN below says host `postgres` where the GitHub mirror's
# (VM-job) DSN says `localhost`. Do not "sync" one into the other.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # `postgres` is the service's network alias (see the header note); the store tests
      # additionally CREATE DATABASE their own per-package databases from this DSN (issue #133).
      SWITCHBOARD_TEST_DATABASE_URL: postgres://switchboard:switchboard@postgres:5432/switchboard?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          # Exclude vendor/: third-party sources (e.g. google/uuid) are not gofmt-clean and
          # are not ours to reformat. go vet/build/test already ignore vendor in module mode.
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
          if [ -n "$unformatted" ]; then echo "unformatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: wait for postgres
        # Belt-and-suspenders on top of the service health-cmd: the entrypoint only exposes TCP
        # once init finished, so a successful /dev/tcp connect means the server takes queries.
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "postgres is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          exit 1
      - name: test
        # The sb.js behavioral suite (jstest/, via TestJSModules) needs node; without it that test
        # SKIPS and non-verbose `go test` shows nothing — so record the JS-gate status explicitly.
        run: |
          if command -v node >/dev/null 2>&1; then
            echo "JS gate active: node $(node --version) — jstest/ runs via TestJSModules"
          else
            echo "WARNING: node not found in PATH — TestJSModules will SKIP: the sb.js behavioral suite (jstest/) will NOT run" >&2
          fi
          go test ./...
      - name: test (race — queue + MCP packages)
        # The durable queue's correctness rests on concurrent claims (FOR UPDATE SKIP LOCKED) and the
        # lease reaper, so the race detector guards the queue packages in the PRIMARY gate too, not
        # only the GitHub mirror (SPEC-0003). internal/mcp joins the list because its session
        # registry, tool layer, and doorbell fan-out are shared state under concurrent HTTP
        # traffic (SPEC-0014 REQ "Concurrency Safety"). internal/adapter joins for the
        # pull-adapter poll loops: shared loop state MUST be race-safe with the race detector
        # enabled in CI (SPEC-0002 REQ "Poll-Loop Lifecycle — Concurrency Safety"). -race needs
        # cgo, hence a C compiler on the runner.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/store/... ./internal/db/... ./internal/ingest/... ./internal/mcp/... ./internal/adapter/...
