# webhook-mcp — Gitea CI (PRIMARY host).
#
# TEMPORARY DIAGNOSTIC LAYOUT: one job per check. This Gitea instance does not expose the Actions
# logs API (runs/jobs/logs all 404 — only /actions/tasks is available, which reports per-JOB
# status). Splitting each check into its own job makes the failing check identifiable from job
# status alone. Once the failing check is fixed, this collapses back to a single sequential job.
#
# All jobs run inside `container: python:3.12-slim-bookworm` (the act_runner does not reliably
# provision Python via actions/setup-python; the container guarantees the 3.12 floor — see ADR-006).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: mypy app

  bandit:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: bandit -c pyproject.toml -r app

  pipaudit:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: pip-audit --skip-editable

  pytest:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: pytest

  gitleaks:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner

  semgrep:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/security-audit --error
