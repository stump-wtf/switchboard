# webhook-mcp — Gitea CI (PRIMARY host: gitea.stump.rocks/joestump/webhook-mcp).
#
# Gitea is the source of truth (ADR-006). This is the fast + security gate the brief (§5.3) mandates:
# ruff, mypy, bandit, pip-audit, Gitleaks, Semgrep, pytest. Reproduce locally with `make ci`.
#
# Host-based (NOT container-based), following the house pattern (reduit/dotfiles run on the host
# image with `sudo apt-get`):
#   - This act_runner cannot run the Node-based actions/checkout inside a `container:` job (a
#     per-check split had every containerized job fail), and it does not reliably provision Python
#     via actions/setup-python (the first run failed all jobs at that step). So we install
#     Python 3.12 + venv via apt and work inside a venv (avoids PEP 668 "externally-managed").
#   - Single sequential job, matching reduit (the act_runner is contended; one job).
#   - Gitleaks runs from a pinned release binary (dotfiles house pattern).
#   - Semgrep is scoped to code rulesets (p/python, p/security-audit), not `--config auto`, which
#     also blocks on mutable action tags — a policy the StumpCloud tag+Dependabot convention does
#     not follow. Same scope on the GitHub mirror.
#
# LOCKSTEP: keep the checks here in sync with .github/workflows/ci.yml (which provisions Python
# differently — GitHub hosted runners support actions/setup-python + a version matrix). Dependabot
# only watches .github/, so bump pins here (gitleaks, action refs) BY HAND (ADR-006).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff + mypy + bandit + pip-audit + gitleaks + semgrep + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12 + venv (host runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-pip curl ca-certificates
          python3 --version
      - name: Install (venv avoids PEP 668 externally-managed error)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev]' semgrep
      - name: ruff (lint + format check)
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: mypy
        run: |
          . .venv/bin/activate
          mypy app
      - name: bandit
        run: |
          . .venv/bin/activate
          bandit -c pyproject.toml -r app
      - name: pip-audit
        run: |
          . .venv/bin/activate
          pip-audit --skip-editable
      - name: gitleaks (pinned release binary, house pattern)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner
      - name: semgrep (code rulesets)
        run: |
          . .venv/bin/activate
          semgrep scan --config p/python --config p/security-audit --error
      - name: pytest
        run: |
          . .venv/bin/activate
          pytest
