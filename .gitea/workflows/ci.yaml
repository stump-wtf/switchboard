# webhook-mcp — Gitea CI (PRIMARY host).
#
# Host-based (NOT container-based): this act_runner cannot run the Node-based actions/checkout
# inside a `container:` job (verified — a per-check split had all jobs fail), and it also does not
# reliably provision Python via actions/setup-python (the very first run failed all jobs at that
# step). So we follow the house pattern (reduit/dotfiles run on the host image with `sudo apt-get`):
# install Python 3.12 + venv via apt and work inside a venv (avoids PEP 668 "externally-managed").
#
# `probe-syspy` is a temporary diagnostic that passes iff the runner's python3 is >= 3.12. If the
# main `checks` job ever fails, this pinpoints whether the host Python version is the cause. It is
# removed once CI is confirmed green.
#
# LOCKSTEP: the CHECKS here mirror .github/workflows/ci.yml (which provisions Python differently —
# GitHub hosted runners support actions/setup-python + a version matrix). Dependabot only watches
# .github/, so bump pins here by hand (ADR-006).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  probe-syspy:
    runs-on: ubuntu-latest
    steps:
      - run: python3 --version || true
      - name: pass iff host python3 >= 3.12
        run: python3 -c "import sys; sys.exit(0 if sys.version_info[:2] >= (3, 12) else 1)"

  checks:
    name: ruff + mypy + bandit + pip-audit + gitleaks + semgrep + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12 + venv (host runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-pip curl ca-certificates
          python3 --version
      - name: Install (venv avoids PEP 668 externally-managed error)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev]' semgrep
      - name: ruff (lint + format check)
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: mypy
        run: |
          . .venv/bin/activate
          mypy app
      - name: bandit
        run: |
          . .venv/bin/activate
          bandit -c pyproject.toml -r app
      - name: pip-audit
        run: |
          . .venv/bin/activate
          pip-audit --skip-editable
      - name: gitleaks (pinned release binary, house pattern)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner
      - name: semgrep (code rulesets)
        run: |
          . .venv/bin/activate
          semgrep scan --config p/python --config p/security-audit --error
      - name: pytest
        run: |
          . .venv/bin/activate
          pytest
