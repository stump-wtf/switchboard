# webhook-mcp — project + tooling config.
# The runtime dependencies below are the stack locked in by ADR-001 (Starlette/Jinja2/HTMX/Pico,
# aiosqlite, redis, mcp, hvac for OpenBao). No application code is shipped in this docs-only
# bootstrap beyond empty package placeholders; the deps are declared so the code session builds
# against them and CI (ADR-006) has an environment to lint/audit/test.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-mcp"
version = "0.1.0"
description = "An MCP server that receives, verifies, normalizes, stores, and exposes inbound webhooks (GitHub, Stripe, Slack, Docker Hub, generic, Redis) to MCP clients and a local web UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joe Stump", email = "joe@stump.rocks" }]
keywords = ["mcp", "webhooks", "starlette", "sse", "homelab", "sqlite"]

# Runtime stack — locked by ADR-001/ADR-002/ADR-003/ADR-004/ADR-005.
dependencies = [
  "starlette>=0.37",      # ASGI framework (ADR-001)
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",   # SSE broadcast (ADR-001)
  "jinja2>=3.1",          # server-rendered templates
  "aiosqlite>=0.20",      # async SQLite (ADR-002)
  "redis>=5.0",           # redis.asyncio consumer (ADR-003)
  "mcp>=1.2",             # MCP server SDK (ADR-005)
  "httpx>=0.27",          # outbound replay + test client
  "hvac>=2.3",            # OpenBao/Vault AppRole client (ADR-004)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://gitea.stump.rocks/joestump/webhook-mcp"
Source = "https://gitea.stump.rocks/joestump/webhook-mcp"
Mirror = "https://github.com/joestump/webhook-mcp"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["app"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
